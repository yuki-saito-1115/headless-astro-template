name: PR checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 ソースコードのチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 型チェックではメディアの実体を使わないので、LFSのダウンロードを省く。
          persist-credentials: false

      - name: 🔎 変更の影響範囲を確認
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test scripts/check-workspaces.test.js
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          # 依存取得前に対象だけを判定し、不要なnpm ciを省く。
          node scripts/check-workspaces.js --base "$BASE_SHA" --head "$HEAD_SHA" --plan

      - name: 🧱 mise のセットアップ（Node.js・npm）
        if: steps.scope.outputs.needed == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: 📍 npmキャッシュの保存先を取得
        if: steps.scope.outputs.needed == 'true'
        id: npm-cache
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: ♻️ npmのダウンロードキャッシュ
        if: steps.scope.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache.outputs.path }}/_cacache
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-

      - name: 📦 依存パッケージのインストール
        if: steps.scope.outputs.needed == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: ✅ 影響するworkspaceのチェック
        if: steps.scope.outputs.needed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check -- --base "$BASE_SHA" --head "$HEAD_SHA"
