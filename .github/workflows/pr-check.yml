name: PR checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 ソースコードのチェックアウト
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # 型チェックではメディアの実体を使わないので、LFSのダウンロードを省く。
          persist-credentials: false

      - name: 🔎 変更の影響範囲を確認
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test scripts/ci-check.test.js
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          node scripts/ci-check.js plan "$BASE_SHA" "$HEAD_SHA"

      - name: 🧱 mise のセットアップ（Node.js・npm）
        if: steps.scope.outputs.needed == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: 📍 npmキャッシュの保存先を取得
        if: steps.scope.outputs.needed == 'true'
        id: npm-cache
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: ♻️ npmのダウンロードキャッシュ
        if: steps.scope.outputs.needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.npm-cache.outputs.path }}/_cacache
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-

      - name: 📦 依存パッケージのインストール
        if: steps.scope.outputs.needed == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🎨 デザイントークンの生成
        if: steps.scope.outputs.needed == 'true'
        run: npm run build:design-token

      - name: ✅ 影響するworkspaceの型生成・チェック
        if: steps.scope.outputs.needed == 'true'
        env:
          CI_CHECK_WORKSPACES: ${{ steps.scope.outputs.workspaces }}
        run: node scripts/ci-check.js run
