name: 🚀 Deploy main Worker
run-name: 🛠️ Deploy main - ${{ github.event_name }}

concurrency:
  group: deploy-main
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    # サイトに関係する変更だけでビルドする。microCMSのwebhookはパスに関係なく実行する。
    paths:
      - apps/site/**
      - packages/**
      - public/**
      - design-token/**
      - scripts/**
      - package.json
      - package-lock.json
      - mise.toml
      - .npmrc
      - tsconfig.json
      - env.d.ts
      - .gitattributes
      - .github/workflows/cloudflare-deploy.yml
      - .github/actions/**
  repository_dispatch:
    types:
      # microcmsのwebhook名（すべてのAPIのWebhook名を同じにしておく）
      - microcms-update

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: main-build
      deployment: false
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - name: 📥 ソースコードのチェックアウト
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          lfs: true
          persist-credentials: false

      - name: 🧱 mise のセットアップ（Node.js・npm）
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: 📍 npmキャッシュの保存先を取得
        id: npm-cache
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: ♻️ npmのダウンロードキャッシュ
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.npm-cache.outputs.path }}/_cacache
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-

      - name: 📦 依存パッケージのインストール
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🛠️ siteアプリケーションworkspaceのビルド
        run: npm run build:site
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      - name: ✅ dist ディレクトリの確認
        run: ls -l ./apps/site/dist

      - name: 🚚 ビルド成果物のアップロード
        id: upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          include-hidden-files: true
          path: ./apps/site/dist/
          retention-days: 1

  deploy:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: main-deploy
      deployment: true
    timeout-minutes: 5
    steps:
      - name: 📥 ソースコードのチェックアウト
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          lfs: true
          persist-credentials: false

      - name: 🧱 mise のセットアップ（Node.js・npm）
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: 📍 npmキャッシュの保存先を取得
        id: npm-cache
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: ♻️ npmのダウンロードキャッシュ
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.npm-cache.outputs.path }}/_cacache
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-

      - name: ⏬ ビルド成果物のダウンロード
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: ./apps/site/dist/

      - name: 📦 依存パッケージのインストール
        # deployで使うsiteとその依存workspaceだけをインストールする。
        run: npm ci --workspace=@headless-astro-template/site --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: 🚀 main Workerへデプロイ
        run: npm run deploy:site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  notify:
    if: ${{ !cancelled() }}
    needs: [build, deploy]
    permissions: {}
    runs-on: ubuntu-latest
    environment:
      name: notification
      deployment: false
    timeout-minutes: 5
    steps:
      - name: 📣 Teamsへデプロイ結果を通知
        env:
          WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$BUILD_RESULT" == "success" ] && [ "$DEPLOY_RESULT" == "success" ]; then
            THEME_COLOR="00a6f4"
            TITLE="✅ Build and Deploy Success."
            SUMMARY="ビルド・デプロイが正常に完了しました。"
          else
            THEME_COLOR="fb2c36"
            TITLE="❌ Build or Deploy Failed."
            SUMMARY="ビルドまたはデプロイ中にエラーが発生しました。"
          fi

          JSON_PAYLOAD="$(jq -n \
            --arg summary "$SUMMARY" \
            --arg themeColor "$THEME_COLOR" \
            --arg title "$TITLE" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg refName "$GITHUB_REF_NAME" \
            --arg runId "$GITHUB_RUN_ID" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": $summary,
              "themeColor": $themeColor,
              "title": $title,
              "sections": [
                {
                  "facts": [
                    { "name": "Workflow: ", "value": $workflow },
                    { "name": "リポジトリ: ", "value": $repository },
                    { "name": "ブランチ: ", "value": $refName }
                  ],
                  "markdown": true
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "詳細を見る",
                  "targets": [
                    {
                      "os": "default",
                      "uri": ("https://github.com/" + $repository + "/actions/runs/" + $runId)
                    }
                  ]
                }
              ]
            }')"

          curl -sS --fail-with-body -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"

  cleanup:
    needs: [build, deploy]
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🗑️ Remove artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID"
