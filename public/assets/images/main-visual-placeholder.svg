<svg
  aria-labelledby="title description"
  role="img"
  viewBox="0 0 1440 500"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="title">メインビジュアルのプレースホルダー</title>
  <desc id="description">青から紫に変化する抽象的な背景</desc>
  <defs>
    <linearGradient
      id="background"
      x1="0"
      x2="1"
      y1="0"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#1447e6"
      />
      <stop
        offset="1"
        stop-color="#9810fa"
      />
    </linearGradient>
    <radialGradient
      cx="50%"
      cy="50%"
      id="light"
      r="50%"
    >
      <stop
        offset="0"
        stop-color="#ffffff"
        stop-opacity=".35"
      />
      <stop
        offset="1"
        stop-color="#ffffff"
        stop-opacity="0"
      />
    </radialGradient>
  </defs>
  <rect
    fill="url(#background)"
    height="500"
    width="1440"
  />
  <circle
    cx="360"
    cy="100"
    fill="url(#light)"
    r="400"
  />
  <circle
    cx="1120"
    cy="440"
    fill="url(#light)"
    r="360"
  />
</svg>
