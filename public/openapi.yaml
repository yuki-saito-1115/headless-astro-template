openapi: 3.0.3
info:
  title: microCMS API
  version: 1.0.0
  description: microCMSのマネジメントAPIから生成したコンテンツAPIの定義
paths:
  /blogs:
    get:
      summary: ブログの一覧取得
      responses:
        '200':
          description: ブログの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Blogs'
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /blogs/{content_id}:
    get:
      summary: ブログの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ブログの詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blogs'
  /categories:
    get:
      summary: カテゴリの一覧取得
      responses:
        '200':
          description: カテゴリの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Categories'
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /categories/{content_id}:
    get:
      summary: カテゴリの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: カテゴリの詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories'
  /sample:
    get:
      summary: サンプルの一覧取得
      responses:
        '200':
          description: サンプルの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sample'
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /sample/{content_id}:
    get:
      summary: サンプルの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: サンプルの詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
components:
  schemas:
    Blogs:
      type: object
      description: ブログ
      properties:
        id: &ref_0
          type: string
        createdAt: &ref_1
          type: string
          format: date-time
        updatedAt: &ref_2
          type: string
          format: date-time
        publishedAt: &ref_3
          type: string
          format: date-time
          nullable: true
        revisedAt: &ref_4
          type: string
          format: date-time
          nullable: true
        title:
          type: string
          description: タイトル
        content:
          type: string
          description: 内容
        eyecatch:
          type: object
          description: アイキャッチ
        category:
          type: object
          description: カテゴリ
    Categories:
      type: object
      description: カテゴリ
      properties:
        id: *ref_0
        createdAt: *ref_1
        updatedAt: *ref_2
        publishedAt: *ref_3
        revisedAt: *ref_4
        name:
          type: string
          description: カテゴリ名
    Sample:
      type: object
      description: サンプル
      properties:
        id: *ref_0
        createdAt: *ref_1
        updatedAt: *ref_2
        publishedAt: *ref_3
        revisedAt: *ref_4
        category:
          type: string
          description: カテゴリ
          enum:
            - カテゴリ1
            - カテゴリ2
            - カテゴリ3
            - カテゴリ4
            - カテゴリ5
        title:
          type: string
          description: タイトル
        content:
          type: string
          description: 内容
        link:
          type: string
          description: リンクURL
