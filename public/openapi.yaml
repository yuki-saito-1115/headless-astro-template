openapi: 3.0.3
info:
  title: microCMS API
  version: 1.0.0
  description: microCMSのマネジメントAPIから生成したコンテンツAPIの定義
paths:
  /trial:
    get:
      summary: おためしの一覧取得
      responses:
        "200":
          description: おためしの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trial"
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /trial/{content_id}:
    get:
      summary: おためしの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: おためしの詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trial"
  /news:
    get:
      summary: お知らせの一覧取得
      responses:
        "200":
          description: お知らせの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: "#/components/schemas/News"
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /news/{content_id}:
    get:
      summary: お知らせの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: お知らせの詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/News"
  /blogs:
    get:
      summary: ブログの一覧取得
      responses:
        "200":
          description: ブログの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Blogs"
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /blogs/{content_id}:
    get:
      summary: ブログの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ブログの詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blogs"
  /categories:
    get:
      summary: カテゴリの一覧取得
      responses:
        "200":
          description: カテゴリの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Categories"
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /categories/{content_id}:
    get:
      summary: カテゴリの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: カテゴリの詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Categories"
  /sample:
    get:
      summary: サンプルの一覧取得
      responses:
        "200":
          description: サンプルの一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sample"
                  totalCount:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /sample/{content_id}:
    get:
      summary: サンプルの詳細取得
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: サンプルの詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sample"
components:
  schemas:
    Trial:
      type: object
      description: おためし
      properties:
        id: &ref_0
          type: string
        createdAt: &ref_1
          type: string
          format: date-time
        updatedAt: &ref_2
          type: string
          format: date-time
        publishedAt: &ref_3
          type: string
          format: date-time
          nullable: true
        revisedAt: &ref_4
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          description: なまえ
        kurikaeshi:
          type: array
          description: 繰り返し
          items:
            oneOf:
              - type: object
                description: カスタム1
                properties:
                  fieldId:
                    type: string
                    enum:
                      - custom1
                  text:
                    type: boolean
                    description: テキスト
                required:
                  - fieldId
              - type: object
                description: カスタム2
                properties:
                  fieldId:
                    type: string
                    enum:
                      - custom2
                  text:
                    type: string
                    description: テキスト
                required:
                  - fieldId
        kasutam1:
          type: object
          description: カスタム1単体
          properties:
            fieldId:
              type: string
              enum:
                - custom1
            text:
              type: boolean
              description: テキスト
          required:
            - fieldId
        kasutam2:
          type: object
          description: カスタム2単体
          properties:
            fieldId:
              type: string
              enum:
                - custom2
            text:
              type: string
              description: テキスト
          required:
            - fieldId
    News:
      type: object
      description: お知らせ
      properties:
        id: *ref_0
        createdAt: *ref_1
        updatedAt: *ref_2
        publishedAt: *ref_3
        revisedAt: *ref_4
        date:
          type: string
          format: date-time
          description: 日付
        category:
          type: array
          description: カテゴリ
          items:
            type: string
            description: カテゴリ
            enum:
              - カテゴリ1
              - カテゴリ2
              - カテゴリ3
              - カテゴリ4
        title:
          type: string
          description: タイトル
        content:
          type: string
          description: 本文
        link:
          type: string
          description: リンク
      required:
        - date
        - category
        - title
    Blogs:
      type: object
      description: ブログ
      properties:
        id: *ref_0
        createdAt: *ref_1
        updatedAt: *ref_2
        publishedAt: *ref_3
        revisedAt: *ref_4
        title:
          type: string
          description: タイトル
        content:
          type: string
          description: 内容
        eyecatch:
          type: object
          description: アイキャッチ
          properties:
            url:
              type: string
              format: uri
            width:
              type: integer
            height:
              type: integer
            alt:
              type: string
          required:
            - url
        category:
          description: カテゴリ
          $ref: "#/components/schemas/Categories"
    Categories:
      type: object
      description: カテゴリ
      properties:
        id: *ref_0
        createdAt: *ref_1
        updatedAt: *ref_2
        publishedAt: *ref_3
        revisedAt: *ref_4
        name:
          type: string
          description: カテゴリ名
    Sample:
      type: object
      description: サンプル
      properties:
        id: *ref_0
        createdAt: *ref_1
        updatedAt: *ref_2
        publishedAt: *ref_3
        revisedAt: *ref_4
        category:
          type: array
          description: カテゴリ
          items:
            type: string
            description: カテゴリ
            enum:
              - カテゴリ1
              - カテゴリ2
              - カテゴリ3
              - カテゴリ4
              - カテゴリ5
        title:
          type: string
          description: タイトル
        content:
          type: string
          description: 内容
        link:
          type: string
          description: リンクURL
